name: Structural risk service

on:
  pull_request:
    paths:
      - 'services/rust-ast/**'
      - '.github/workflows/structural-risk.yml'
  workflow_dispatch:

jobs:
  rust-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rust-ast
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test structural risk service
        run: cargo test --locked
