name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      # The old verify:* steps referenced scripts deleted with the Next.js-era
      # cleanup (937d822); their coverage now lives in the unit-test suite.
      - name: Lint
        run: npm run lint

      # ── Phase 3 (Vercel adoption plan): a broken build must not be promotable ──
      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders only; runtime secrets come from Coolify.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          VITE_APP_URL: http://localhost:3001

      # A stale committed route tree is exactly what turned CI red on
      # 2026-08-21: PR #14 added three API routes without regenerating it, and
      # type-check can never self-heal because it runs BEFORE the build. The
      # build above regenerates the tree, so any diff here proves the committed
      # file was out of date.
      - name: Route tree is up to date
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error file=src/routeTree.gen.ts::Stale route tree. Run 'npm run build' and commit the regenerated src/routeTree.gen.ts."
            git diff --stat -- src/routeTree.gen.ts
            exit 1
          fi

      # Boot the built server and assert the SAFETY invariants: auth is
      # enforced, unsigned Stripe webhooks are rejected, errors leak nothing.
      # Placeholders are enough because every check asserts a REJECTION.
      - name: Deploy-safety smoke tests
        run: |
          node scripts/start-production.mjs > /tmp/start-production.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          # Without this branch a server that never binds looks exactly like a
          # server that rejects every request: the loop just expires and all
          # twelve checks report "fetch failed", which is what hid a missing
          # PORT. Say which of the two happened, and show the server log.
          if [ "$READY" -ne 1 ]; then
            echo "::error::start-production.mjs never answered on http://localhost:3001/health"
            cat /tmp/start-production.log
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi
          node scripts/verify-deploy-smoke.mjs http://localhost:3001
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then cat /tmp/start-production.log; fi
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS
        env:
          # start-production.mjs listens on PORT (default 3000); every URL in
          # this step is 3001. Without this the server comes up healthy on the
          # wrong port and all twelve checks fail with "fetch failed".
          PORT: "3001"
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          VITE_APP_URL: http://localhost:3001
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
