name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Agent mode routing
        run: npx tsx scripts/verify-agent-mode-routing.ts

      - name: OpenRouter routing
        run: npx tsx scripts/verify-openrouter-routing.ts

      - name: Intelligence routing heuristics
        run: npm run verify:intelligence

      - name: Preview transpiler + export contracts
        run: npm run verify:previews

      - name: Lint
        run: npm run lint
