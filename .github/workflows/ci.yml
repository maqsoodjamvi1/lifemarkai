name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      # The old verify:* steps referenced scripts deleted with the Next.js-era
      # cleanup (937d822); their coverage now lives in the unit-test suite.
      - name: Lint
        run: npm run lint
