name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            migration/tanstack-start-app/package-lock.json

      - run: npm ci

      # The TanStack Start app has its own package.json/lockfile — root
      # `npm ci` does NOT install it. Without this step every @tanstack/vite
      # import fails to resolve and the app falls back to the root's older
      # @supabase/supabase-js, whose mismatched generics collapse all table
      # types to `never` (hundreds of phantom type errors).
      - run: npm ci --prefix migration/tanstack-start-app

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Agent mode routing
        run: npx tsx scripts/verify-agent-mode-routing.ts

      - name: OpenRouter routing
        run: npx tsx scripts/verify-openrouter-routing.ts

      - name: Intelligence routing heuristics
        run: npm run verify:intelligence

      - name: Preview transpiler + export contracts
        run: npm run verify:previews

      - name: Lint
        run: npm run lint
